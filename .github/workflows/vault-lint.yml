name: Vault lint

on:
  pull_request:
    paths:
      - "ops/vault/**"
      - "docker-compose.vault.yml"
      - "api/src/lib/vault/**"
      - ".github/workflows/vault-lint.yml"

permissions:
  contents: read

concurrency:
  group: vault-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VAULT_IMAGE: hashicorp/vault:1.18.3

jobs:
  scripts:
    name: Shell scripts and compose override
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -s bash ops/vault/bin/*.sh
      - name: Validate compose override
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          JWT_ACCESS_SECRET: ci
          JWT_REFRESH_SECRET: ci
          SEED_ADMIN_EMAIL: ci@example.com
          SEED_ADMIN_PASSWORD: ci
          ENCRYPTION_KEY: ci
          HASH_KEY: ci
        run: docker compose -f docker-compose.yml -f docker-compose.vault.yml config -q

  bootstrap:
    name: Configure and seed a dev server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start Vault in dev mode
        run: |
          docker run -d --name vault-ci --cap-add IPC_LOCK \
            -e VAULT_DEV_ROOT_TOKEN_ID=ci-root -e VAULT_ADDR=http://127.0.0.1:8200 \
            "$VAULT_IMAGE"
          for _ in $(seq 1 30); do
            docker exec vault-ci vault status >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs vault-ci
          exit 1
      - name: Configure, seed and rotate
        env:
          VAULT_BIN: docker exec -i -e VAULT_TOKEN vault-ci vault
          VAULT_TOKEN: ci-root
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          printf 'JWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nENCRYPTION_KEY=%s\nHASH_KEY=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -base64 32)" "$(openssl rand -base64 32)" "$(openssl rand -hex 16)" >"$out/env"
          ops/vault/bin/configure.sh --out "$out"
          ops/vault/bin/seed.sh --env-file "$out/env"
          ops/vault/bin/rotate-secret-id.sh --out "$out" --revoke-old
          test -s "$out/api_role_id"
          test -s "$out/api_secret_id"
      - name: Stop Vault
        if: always()
        run: docker rm -f vault-ci
