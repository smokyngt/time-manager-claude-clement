name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "api/openapi.json"
      - "Makefile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "api/openapi.json"
      - "Makefile"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Docs (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [public, internal, openapi, typedocs]
    defaults:
      run:
        working-directory: docs/${{ matrix.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check translations
        if: matrix.site == 'public'
        run: node scripts/check-i18n.mjs
      - name: Typecheck
        if: matrix.site != 'openapi'
        run: bun run typecheck
      - name: Build
        run: bun run build
