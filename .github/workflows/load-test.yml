name: Load test

# k6 scenarios live in ops/load (documentation: docs/PERFORMANCE.md).
# Manual: pick a scenario. Weekly: the `load` scenario against a freshly seeded API.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run
        type: choice
        default: smoke
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: read

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  k6:
    name: k6 ${{ inputs.scenario || 'load' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: timemanager
          POSTGRES_PASSWORD: timemanager
          POSTGRES_DB: timemanager_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timemanager -d timemanager_load"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SCENARIO: ${{ inputs.scenario || 'load' }}
      # Remote write is optional: set the secret to push metrics (native histograms) to Prometheus.
      K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-api-${{ runner.os }}-${{ hashFiles('api/bun.lock') }}
          restore-keys: bun-api-${{ runner.os }}-

      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Migrate and seed demo data
        working-directory: api
        env:
          DATABASE_URL: postgres://timemanager:timemanager@localhost:5432/timemanager_load
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
        run: |
          bun run db:migrate
          bun run db:seed:demo

      - name: Start the API
        working-directory: api
        env:
          NODE_ENV: production
          PORT: "8000"
          LOG_LEVEL: warn
          DATABASE_URL: postgres://timemanager:timemanager@localhost:5432/timemanager_load
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
          # Rate limits protect a real deployment; a load test would only measure them.
          AUTH_LOGIN_RATE_LIMIT_MAX: "100000"
          AUTH_RATE_LIMIT_MAX: "100000"
          AUTH_ACCOUNT_RATE_LIMIT_MAX: "1000"
          USER_RATE_LIMIT_MAX: "10000000"
          CLOCK_RATE_LIMIT_MAX: "10000000"
          TEAM_RATE_LIMIT_MAX: "10000000"
          REPORT_RATE_LIMIT_MAX: "10000000"
        run: |
          nohup bun src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Compute k6 flags
        id: flags
        run: |
          flags="-e BASE_URL=http://localhost:8000 -e SUMMARY_DIR=ops/load/results"
          if [ -n "$K6_PROMETHEUS_RW_SERVER_URL" ]; then
            flags="$flags -o experimental-prometheus-rw --tag testid=${GITHUB_RUN_ID}-${SCENARIO}"
            echo "K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true" >> "$GITHUB_ENV"
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Run k6 (${{ env.SCENARIO }})
        uses: grafana/run-k6-action@v1
        with:
          path: ops/load/${{ env.SCENARIO }}.js
          flags: ${{ steps.flags.outputs.flags }}

      - name: Publish job summary
        if: always()
        run: |
          if [ -f "ops/load/results/${SCENARIO}-summary.md" ]; then
            cat "ops/load/results/${SCENARIO}-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No k6 summary was produced for \`${SCENARIO}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-${{ env.SCENARIO }}-${{ github.run_id }}
          path: |
            ops/load/results/*.json
            ops/load/results/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: API log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true
