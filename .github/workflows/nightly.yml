name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  api:
    name: API full tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: timemanager
          POSTGRES_PASSWORD: timemanager
          POSTGRES_DB: timemanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timemanager -d timemanager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://timemanager:timemanager@localhost:5432/timemanager_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run db:migrate
      - name: Integration tests
        if: hashFiles('api/tests/integration/**') != ''
        run: bun test tests/integration

  web:
    name: Web full tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run build

  e2e:
    name: Web E2E (Playwright)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: timemanager
          POSTGRES_PASSWORD: timemanager
          POSTGRES_DB: timemanager_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timemanager -d timemanager_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://timemanager:timemanager@localhost:5432/timemanager_e2e
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password
      CORS_ORIGIN: http://localhost:5173
      WEB_URL: http://localhost:5173
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - name: Detect e2e suite
        id: detect
        run: echo "present=${{ hashFiles('web/e2e/**') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Note when skipped
        if: steps.detect.outputs.present != 'true'
        run: echo "web/e2e not found, E2E skipped." >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@v2
        if: steps.detect.outputs.present == 'true'
        with:
          bun-version: 1.3.x
      - name: Install API dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: api
        run: bun install --frozen-lockfile
      - name: Install web dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Migrate and seed
        if: steps.detect.outputs.present == 'true'
        working-directory: api
        run: bun run db:migrate && bun run db:seed
      - name: Start API
        if: steps.detect.outputs.present == 'true'
        working-directory: api
        run: |
          nohup bun src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Install Playwright browser
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: bunx playwright test
      - name: Upload Playwright report
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: Show API log
        if: failure() && steps.detect.outputs.present == 'true'
        run: cat /tmp/api.log

  dependencies:
    name: Dependency report (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      # bun >= 1.2.15 ships `bun audit` (queries the npm advisory DB from bun.lock);
      # osv-scanner is therefore not needed. Reports never fail the nightly job.
      - name: bun audit
        run: |
          {
            echo "### ${{ matrix.package }}: bun audit"
            echo '```'
            bun audit --audit-level=low 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: bun audit gate (high and above)
        run: bun audit --audit-level=high
        continue-on-error: true
      - name: bun outdated
        run: |
          {
            echo "### ${{ matrix.package }}: bun outdated"
            echo '```'
            bun outdated 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
