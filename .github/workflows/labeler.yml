name: Labeler

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Label PR by path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target: config is read from the base branch; PR code is never checked out.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
