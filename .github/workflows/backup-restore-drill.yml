name: Backup restore drill

# Proves, every week, that a dump produced by ops/backup/bin/backup.sh can be restored
# and queried: migrate + seed demo data, back up (age-encrypted), restore into a scratch
# database and run the sanity queries. Uses throwaway demo data, never production.

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: Backup, restore and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: timemanager
          POSTGRES_PASSWORD: timemanager
          POSTGRES_DB: timemanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timemanager -d timemanager"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://timemanager:timemanager@localhost:5432/timemanager
      JWT_ACCESS_SECRET: drill-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: drill-refresh-secret-0123456789abcdef0123456789abcdef
      BACKUP_DIR: ${{ github.workspace }}/.backup-drill
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile
      - name: Apply migrations
        working-directory: api
        run: bun run db:migrate
      - name: Seed demo data
        working-directory: api
        run: bun run db:seed:demo
      - name: Generate a throwaway age key
        run: |
          age-keygen -o "$RUNNER_TEMP/drill-age.key" 2> "$RUNNER_TEMP/drill-age.pub"
          echo "BACKUP_AGE_RECIPIENT=$(grep -o 'age1[a-z0-9]*' "$RUNNER_TEMP/drill-age.pub")" >> "$GITHUB_ENV"
          echo "BACKUP_AGE_IDENTITY_FILE=$RUNNER_TEMP/drill-age.key" >> "$GITHUB_ENV"
      - name: Back up
        run: ops/backup/bin/backup.sh
      - name: Restore into a scratch database and verify
        run: ops/backup/bin/verify.sh
      - name: Check that the scratch database was dropped
        run: |
          left="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_database WHERE datname LIKE 'tm_verify_%'")"
          test "$left" = "0"
      - name: Upload the encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_DIR }}/*.dump.age
            ${{ env.BACKUP_DIR }}/*.sha256
          retention-days: 3
          if-no-files-found: error
