name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. See SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Web, Docker / deployment, CI, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit or image tag
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
