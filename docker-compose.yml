# Production stack: `docker compose up --build`
# Only the web container (nginx) is published; db and api stay on the internal network.
# The api container applies migrations and the idempotent admin seed on startup, using the
# same runtime image (compiled dist/db/*.js + drizzle/), so no drizzle-kit or extra service.
# This assumes a single api replica; scale out only after moving migrations to a release step.

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-8000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
  WEB_URL: ${WEB_URL:-http://localhost:8080}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/v1/auth/microsoft/callback}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
  # nginx terminates the proxy hop; set COOKIE_SECURE=true once served over HTTPS.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Number of trusted proxy hops in front of the api (nginx = 1).
  TRUST_PROXY: ${TRUST_PROXY:-1}
  # Local prod stack is plain http://localhost:8080; the api rejects non-https WEB_URL otherwise.
  ALLOW_INSECURE_URLS: ${ALLOW_INSECURE_URLS:-true}
  # Field encryption and lookup hashing (see docs/ENCRYPTION.md). Both are required in production.
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -base64 32)}
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-k1}
  ENCRYPTION_KEYS_PREVIOUS: ${ENCRYPTION_KEYS_PREVIOUS:-}
  HASH_KEY: ${HASH_KEY:?HASH_KEY is required (openssl rand -base64 32)}
  # Required by the api only when MICROSOFT_CLIENT_ID is set.
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # Empty = tracing off. docker-compose.observability.yml points it at alloy.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-time-manager-api}
  APP_VERSION: ${APP_VERSION:-}
  JSON_BODY_MAX_DEPTH: ${JSON_BODY_MAX_DEPTH:-10}
  MIGRATIONS_DIR: drizzle
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
  USER_RATE_LIMIT_MAX: ${USER_RATE_LIMIT_MAX:-100}
  USER_RATE_LIMIT_WINDOW: ${USER_RATE_LIMIT_WINDOW:-1 minute}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
  AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1 minute}
  AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
  AUTH_LOGIN_RATE_LIMIT_WINDOW: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:-1 minute}
  AUTH_ACCOUNT_RATE_LIMIT_MAX: ${AUTH_ACCOUNT_RATE_LIMIT_MAX:-10}
  AUTH_ACCOUNT_RATE_LIMIT_WINDOW: ${AUTH_ACCOUNT_RATE_LIMIT_WINDOW:-1 minute}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
      target: runtime
    restart: unless-stopped
    environment: *api-env
    command: ["sh", "-c", "bun run db:migrate:prod && bun run db:seed:prod && exec bun run start"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      # Repo root: the web bundle imports the SDK from sdks/typescript.
      context: .
      dockerfile: web/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  db-data:

networks:
  backend:
