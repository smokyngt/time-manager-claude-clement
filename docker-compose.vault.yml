# HashiCorp Vault secrets management:
#   docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d
# (or `make vault-up`). Bootstrap order: make vault-up, vault-init, vault-unseal,
# vault-configure, vault-seed. See ops/vault/bin/*.sh for each step.
#
# Vault listens on the internal network only. The single published port is bound to
# 127.0.0.1 for the operator. For TLS set VAULT_CONFIG_FILE=vault.tls.hcl and mount
# certificates at /vault/tls (see VAULT_TLS_DIR); then use https:// in VAULT_ADDR and
# set VAULT_CACERT for the api.
#
# Vault starts sealed after every restart: run `make vault-unseal`. The api retries
# through `restart: unless-stopped` until Vault answers. Credentials come from the
# files created by `make vault-configure` and mounted as Docker secrets.

services:
  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    command: ["server", "-config=/vault/config/${VAULT_CONFIG_FILE:-vault.hcl}"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    volumes:
      - vault-data:/vault/file
      - ./ops/vault/config:/vault/config:ro
      - ${VAULT_TLS_DIR:-./ops/vault/tls}:/vault/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend]

  api:
    environment:
      VAULT_ADDR: ${VAULT_API_ADDR:-http://vault:8200}
      VAULT_CACERT: ${VAULT_CACERT:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_ROLE_ID_FILE: /run/secrets/vault_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
      VAULT_SECRET_PATHS: ${VAULT_SECRET_PATHS:-time-manager/api,time-manager/shared}
    secrets:
      - vault_role_id
      - vault_secret_id
    depends_on:
      vault:
        condition: service_healthy

secrets:
  vault_role_id:
    file: ${VAULT_SECRETS_DIR:-./ops/vault/secrets}/api_role_id
  vault_secret_id:
    file: ${VAULT_SECRETS_DIR:-./ops/vault/secrets}/api_secret_id

volumes:
  vault-data:
