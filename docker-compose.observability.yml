# Observability stack (Grafana, Prometheus, Tempo, Loki, Alloy, Alertmanager, postgres-exporter).
# Layer it on the production stack:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Only Grafana is published (127.0.0.1:3000 by default). Everything else stays on the
# internal "observability" network; alloy and postgres-exporter also join the app network
# ("backend") to scrape the api and db. See docs/OBSERVABILITY.md.
#
# Required in .env: GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD, METRICS_TOKEN.

x-obs-logging: &obs-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-obs-hardened: &obs-hardened
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  logging: *obs-logging

services:
  # --- App services: telemetry wiring only (merged into docker-compose.yml). ---
  api:
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required (Alloy scrapes /metrics with it)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-time-manager-api}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    labels:
      observability.logs: "true"
  db:
    labels:
      observability.logs: "true"
  web:
    labels:
      observability.logs: "true"

  # --- One-shot: give the non-root Tempo user (10001) ownership of its volume. ---
  observability-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    mem_limit: 32m
    pids_limit: 20
    logging: *obs-logging
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/tempo && chown -R 10001:10001 /var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    <<: *obs-hardened
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 200
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only socket mount: Alloy lists containers and tails their logs. The Docker socket
      # is root-equivalent; see "Security" in docs/OBSERVABILITY.md for alternatives.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "Alloy is ready" <&3'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks: [observability, backend]

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    <<: *obs-hardened
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 200
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    <<: *obs-hardened
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
          pids: 100
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./ops/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [observability, egress]

  tempo:
    image: grafana/tempo:2.8.2@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    <<: *obs-hardened
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 200
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      observability-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [observability]

  loki:
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    <<: *obs-hardened
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
          pids: 200
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./ops/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [observability]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    <<: *obs-hardened
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
          pids: 100
    environment:
      # Prefer the read-only monitoring role (ops/observability/postgres-exporter/monitoring-user.sql).
      # The fallback reuses the application credentials so the stack works out of the box;
      # URL-encode special characters in the password.
      DATA_SOURCE_NAME: ${PG_EXPORTER_DATA_SOURCE_NAME:-postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [observability, backend]

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    <<: *obs-hardened
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 200
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://alertmanager:9093/-/healthy}
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Branding overlays (OSS has no white-label setting): see docs/OBSERVABILITY.md.
      - ./ops/observability/grafana/branding/grafana_icon.svg:/usr/share/grafana/public/img/grafana_icon.svg:ro
      - ./ops/observability/grafana/branding/g8_login_dark.svg:/usr/share/grafana/public/img/g8_login_dark.svg:ro
      - ./ops/observability/grafana/branding/g8_login_light.svg:/usr/share/grafana/public/img/g8_login_light.svg:ro
      - ./ops/observability/grafana/branding/login_background_dark.svg:/usr/share/grafana/public/img/login_background_dark.svg:ro
      - ./ops/observability/grafana/branding/login_background_light.svg:/usr/share/grafana/public/img/login_background_light.svg:ro
      - ./ops/observability/grafana/branding/fav32.png:/usr/share/grafana/public/img/fav32.png:ro
      - ./ops/observability/grafana/branding/apple-touch-icon.png:/usr/share/grafana/public/img/apple-touch-icon.png:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [observability, grafana-edge]

volumes:
  alloy-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:

networks:
  observability:
    internal: true
  grafana-edge:
  egress:
