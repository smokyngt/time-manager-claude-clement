# Scheduled PostgreSQL backups: `docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d --build`
# (or `make backup-up`). See docs/BACKUPS.md for retention, encryption, offsite copies and restores.
# Only the variables listed here reach the container: the .env file is not passed through wholesale.

x-backup-env: &backup-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
  PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
  TZ: ${BACKUP_TZ:-UTC}
  BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-15 2 * * *}
  BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
  BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
  BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
  BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
  BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
  BACKUP_ENCRYPTION_RECIPIENT: ${BACKUP_ENCRYPTION_RECIPIENT:-}
  BACKUP_S3_URI: ${BACKUP_S3_URI:-}
  BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
  BACKUP_S3_CLIENT: ${BACKUP_S3_CLIENT:-auto}
  BACKUP_ALERT_WEBHOOK: ${BACKUP_ALERT_WEBHOOK:-}
  BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

services:
  backup:
    build:
      context: ./ops/backup
      args:
        WITH_AWS_CLI: ${BACKUP_WITH_AWS_CLI:-1}
        WITH_RCLONE: ${BACKUP_WITH_RCLONE:-0}
    restart: unless-stopped
    environment: *backup-env
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 1m
    networks: [backend]

  # One-off tools, never started by `up`:
  #   docker compose -f docker-compose.yml -f docker-compose.backup.yml --profile tools run --rm restore restore.sh --help
  #   docker compose -f docker-compose.yml -f docker-compose.backup.yml --profile tools run --rm restore verify.sh
  # Encrypted backups need BACKUP_AGE_IDENTITY_HOST_PATH, a host path to the age identity file.
  restore:
    profiles: [tools]
    build:
      context: ./ops/backup
      args:
        WITH_AWS_CLI: ${BACKUP_WITH_AWS_CLI:-1}
        WITH_RCLONE: ${BACKUP_WITH_RCLONE:-0}
    environment: *backup-env
    volumes:
      - backups:/backups:ro
      - ${BACKUP_AGE_IDENTITY_HOST_PATH:-/dev/null}:/run/age-identity:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["restore.sh", "--help"]
    networks: [backend]

volumes:
  backups:
