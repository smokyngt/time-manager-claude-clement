nameOverride: ""

image:
  pullPolicy: IfNotPresent
  pullSecrets: []
  api:
    repository: ghcr.io/smokyngt/time-manager-claude-clement/api
    tag: ""
    digest: ""
  web:
    repository: ghcr.io/smokyngt/time-manager-claude-clement/web
    tag: ""
    digest: ""
  backup:
    repository: ghcr.io/smokyngt/time-manager-claude-clement/backup
    tag: ""
    digest: ""
  vault:
    repository: hashicorp/vault
    tag: "2.0.4"
    digest: ""

vault:
  address: https://vault.vault.svc.cluster.local:8200
  namespace: vault
  caSecret: vault-ca-bundle
  caMountPath: /etc/vault-ca

api:
  envConfigMap: time-manager-api-env
  serviceAccount:
    name: time-manager-api
    annotations: {}
  replicas: 2
  port: 8000
  tls:
    enabled: true
  logLevel: info
  extraEnv: []
  otel:
    enabled: true
    endpoint: http://alloy.observability.svc.cluster.local:4318
    protocol: http/protobuf
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  startupProbe:
    periodSeconds: 3
    failureThreshold: 40
    timeoutSeconds: 3
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  livenessProbe:
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 3
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  podAnnotations: {}

web:
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  podAnnotations: {}

migration:
  enabled: true
  seed: true
  activeDeadlineSeconds: 600
  backoffLimit: 2
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    customMetrics: []
  web:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  api:
    minAvailable: 1
  web:
    minAvailable: 1

postgres:
  clusterName: time-manager-db
  host: ""
  port: 5432
  database: timemanager
  credentialsSecret: postgres-credentials
  sslmode: require

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  podMonitor:
    enabled: false
  metricsToken:
    enabled: true
    secretName: time-manager-metrics-token
    vaultKey: monitoring/api-metrics
    vaultProperty: token
    secretStore: vault
    refreshInterval: 1h
  labels: {}

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  observabilityNamespace: observability
  cnpgNamespace: cnpg-system
  kubeApiCidrs:
    - 0.0.0.0/0
  kubeApiPorts:
    - 443
    - 6443
  s3Cidrs:
    - 0.0.0.0/0
  s3Port: 443

backup:
  enabled: true
  schedule: "15 2 * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  s3Secret: backup-s3
  s3Uri: ""
  s3EndpointUrl: ""
  s3Client: auto
  awsRegion: us-east-1
  ageRecipient: ""
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  alertWebhookSecret: ""
  scratchSize: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

vaultSnapshot:
  enabled: true
  schedule: "45 2 * * *"
  timeZone: Etc/UTC
  suspend: false
  role: vault-raft-snapshot
  serviceAccount:
    name: vault-raft-snapshot
    annotations: {}
  activeDeadlineSeconds: 900
  backoffLimit: 1
  s3Prefix: vault-raft
  scratchSize: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nginx:
  resolverValid: 10s
  limitReqApiRate: 30r/s
  limitReqLoginRate: 10r/m
