apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tm.web" . }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "web") | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.vaultSnapshot.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vaultSnapshot.serviceAccount.name }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "vault-raft-snapshot") | nindent 4 }}
  {{- with .Values.vaultSnapshot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tm.name" . }}-backup
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "backup") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
