{{- if .Values.monitoring.metricsToken.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.monitoring.metricsToken.secretName }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.monitoring.metricsToken.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.monitoring.metricsToken.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.monitoring.metricsToken.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.monitoring.metricsToken.vaultKey }}
        property: {{ .Values.monitoring.metricsToken.vaultProperty }}
{{- end }}
{{- if .Values.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tm.api" . }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  endpoints:
    - port: {{ include "tm.scheme" . }}
      path: /metrics
      scheme: {{ include "tm.scheme" . }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      {{- if .Values.api.tls.enabled }}
      tlsConfig:
        serverName: {{ include "tm.api" . }}
        ca:
          secret:
            name: {{ .Values.vault.caSecret }}
            key: ca.crt
      {{- end }}
      {{- if .Values.monitoring.metricsToken.enabled }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.monitoring.metricsToken.secretName }}
          key: token
      {{- end }}
      relabelings:
        - targetLabel: job
          replacement: api
        - targetLabel: instance
          sourceLabels: [__meta_kubernetes_pod_name]
{{- end }}
{{- if .Values.monitoring.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "tm.api" . }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ include "tm.scheme" . }}
      path: /metrics
      scheme: {{ include "tm.scheme" . }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      {{- if .Values.api.tls.enabled }}
      tlsConfig:
        serverName: {{ include "tm.api" . }}
        ca:
          secret:
            name: {{ .Values.vault.caSecret }}
            key: ca.crt
      {{- end }}
      {{- if .Values.monitoring.metricsToken.enabled }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.monitoring.metricsToken.secretName }}
          key: token
      {{- end }}
{{- end }}
