{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    {{- include "tm.chartLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    {{- include "tm.chartLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "tm.selector" (dict "ctx" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
        - podSelector:
            matchLabels:
              {{- include "tm.selector" (dict "ctx" . "component" "web") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "tm.name" . }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - migration
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.clusterName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.vault.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "tm.chartLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.clusterName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - {{ include "tm.name" . }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - migration
                  - backup
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.clusterName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.cnpgNamespace }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.clusterName }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 9187
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.clusterName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
        - protocol: TCP
          port: 8000
    - to:
        {{- range $np.kubeApiCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.kubeApiPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- range $np.s3Cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $np.s3Port }}
{{- if .Values.backup.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "backup") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "backup") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.clusterName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - to:
        {{- range $np.s3Cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $np.s3Port }}
{{- end }}
{{- if .Values.vaultSnapshot.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-raft-snapshot
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "vault-raft-snapshot") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "vault-raft-snapshot") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.vault.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: 8200
    - to:
        {{- range $np.s3Cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $np.s3Port }}
{{- end }}
{{- end }}
