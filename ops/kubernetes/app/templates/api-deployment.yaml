apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tm.api" . }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tm.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tm.labels" (dict "ctx" . "component" "api") | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- include "tm.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "tm.podSecurity" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "tm.image" (dict "ctx" . "image" .Values.image.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Values.api.envConfigMap }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.api.tag | default .Chart.AppVersion | quote }}
            - name: OTEL_SERVICE_NAME
              value: time-manager-api
            {{- if .Values.api.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.api.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.api.otel.protocol | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ include "tm.scheme" . }}
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: {{ include "tm.scheme" . }}
              scheme: {{ include "tm.scheme" . | upper }}
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ include "tm.scheme" . }}
              scheme: {{ include "tm.scheme" . | upper }}
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ include "tm.scheme" . }}
              scheme: {{ include "tm.scheme" . | upper }}
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "tm.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: vault-ca
              mountPath: {{ .Values.vault.caMountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "tm.caVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.api.topologySpreadConstraints }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels:
              {{- include "tm.selector" (dict "ctx" $ "component" "api") | nindent 14 }}
        {{- end }}
      {{- end }}
