{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tm.name" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "migration") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "tm.labels" (dict "ctx" . "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- include "tm.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "tm.podSecurity" (dict "uid" 65532) | nindent 8 }}
      initContainers:
        - name: migrate
          {{- include "tm.migrationContainer" (dict "ctx" . "script" "dist/db/migrate.js") | nindent 10 }}
      containers:
        {{- if .Values.migration.seed }}
        - name: seed
          {{- include "tm.migrationContainer" (dict "ctx" . "script" "dist/db/seed.js") | nindent 10 }}
        {{- else }}
        - name: done
          image: {{ include "tm.image" (dict "ctx" . "image" .Values.image.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -e
            - process.exit(0)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            {{- include "tm.containerSecurity" . | nindent 12 }}
        {{- end }}
      volumes:
        {{- include "tm.caVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
