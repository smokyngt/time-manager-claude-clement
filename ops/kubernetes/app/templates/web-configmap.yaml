apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tm.web" . }}-nginx
  labels:
    {{- include "tm.labels" (dict "ctx" . "component" "web") | nindent 4 }}
data:
  default.conf: |

    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        "https" "https";
    }

    map $fwd_proto $hsts {
        default "";
        "https" "max-age=31536000; includeSubDomains";
    }

    map $http_x_request_id $req_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    }

    log_format tm '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent '
                    '"$http_user_agent" rid=$req_id rt=$request_time';

    limit_req_zone $binary_remote_addr zone=login:10m rate={{ .Values.nginx.limitReqLoginRate }};
    limit_req_zone $binary_remote_addr zone=api:10m rate={{ .Values.nginx.limitReqApiRate }};
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/manifest+json image/svg+xml font/ttf font/otf application/wasm;

    include /etc/nginx/snippets/real-ip.conf;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;
        absolute_redirect off;
        port_in_redirect off;
        access_log /dev/stdout tm;

        client_max_body_size 1m;
        client_body_buffer_size 16k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 8k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 15s;
        keepalive_timeout 15s;
        reset_timedout_connection on;

        {{- if .Values.api.tls.enabled }}
        proxy_ssl_server_name on;
        proxy_ssl_name {{ include "tm.api" . }};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate {{ .Values.vault.caMountPath }}/ca.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        {{- end }}

        error_page 429 @rate_limited;

        location ~ /\.(?!well-known/) {
            access_log off;
            return 404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location @rate_limited {
            default_type application/json;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Retry-After "60" always;
            add_header Cache-Control "no-store" always;
            return 429 '{"error":"too_many_requests"}';
        }

        location = /v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass {{ include "tm.scheme" . }}://{{ include "tm.api" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }};
        }

        location ^~ /v1/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass {{ include "tm.scheme" . }}://{{ include "tm.api" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }};
        }

        location ~ ^/docs(?:/|$) {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers-base.conf;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            proxy_pass {{ include "tm.scheme" . }}://{{ include "tm.api" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }};
        }

        location ^~ /assets/ {
            include /etc/nginx/snippets/static.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ^~ /icons/ {
            include /etc/nginx/snippets/static.conf;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/snippets/static.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location ~ ^/(?:sw|registerSW)\.js$ {
            include /etc/nginx/snippets/static.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location ~ ^/workbox-[^/]+\.js$ {
            include /etc/nginx/snippets/static.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            include /etc/nginx/snippets/static.conf;
            types { application/manifest+json webmanifest; }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/static.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
