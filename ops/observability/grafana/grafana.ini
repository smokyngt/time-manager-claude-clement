; Time Manager Observability: Grafana OSS configuration.
; Secrets and deployment specifics (admin credentials, root_url, cookie_secure) come from the
; GF_* environment variables set in docker-compose.observability.yml.
; NOTE: the browser tab title / app name ("Grafana") is hard-coded in OSS; logos, favicon and
; login background are replaced by file overlays (see the internal docs, Operations, Observability).

app_mode = production
instance_name = time-manager-observability

[server]
protocol = http
http_port = 3000
enable_gzip = true
; root_url comes from GF_SERVER_ROOT_URL.

[paths]
provisioning = /etc/grafana/provisioning

[security]
; admin_user / admin_password come from GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
; (compose refuses to start without them).
disable_gravatar = true
hide_version = true
allow_embedding = false
; Overridden by GF_SECURITY_COOKIE_SECURE (GRAFANA_COOKIE_SECURE); set true behind HTTPS.
cookie_secure = false
cookie_samesite = lax
x_content_type_options = true
x_xss_protection = true
; Enable once Grafana is served over HTTPS by a reverse proxy.
strict_transport_security = false
content_security_policy = true
content_security_policy_template = """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';frame-ancestors 'none';"""

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark
viewers_can_edit = false

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/time-manager/overview.json
min_refresh_interval = 10s
versions_to_keep = 10

[date_formats]
default_timezone = browser

[feature_toggles]
; Trace <-> metrics <-> logs correlations. Several of these are GA in Grafana 12 (no-ops there)
; and are kept so the same file works on older 10.x/11.x images.
enable = traceToMetrics,correlations,tempoApmTable,traceqlSearch

[unified_alerting]
enabled = true
min_interval = 10s

[alerting]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[help]
enabled = false

[snapshots]
external_enabled = false

[plugins]
plugin_admin_enabled = false

[metrics]
enabled = true
disable_total_stats = true

[log]
mode = console
level = info

[log.console]
format = json
