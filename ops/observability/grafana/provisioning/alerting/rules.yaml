# Grafana-managed alert rules mirroring the critical Prometheus rules
# (ops/observability/prometheus/rules/alerts.yml). Generated by grafana/tools/generate.py.
# Grafana notifies the `tm-webhook` contact point; Prometheus alerts go through Alertmanager.
apiVersion: 1
groups:
  - orgId: 1
    name: "tm-critical"
    folder: "Time Manager"
    interval: "1m"
    rules:
      - uid: "tm-api-down"
        title: "ApiDown"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              datasource:
                type: "prometheus"
                uid: "prometheus"
              editorMode: "code"
              expr: "min(up{job=\"api\"})"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
              refId: "C"
        noDataState: "Alerting"
        execErrState: "Error"
        for: "1m"
        annotations:
          summary: "API scrape target is down"
          runbook: "docs/OBSERVABILITY.md#apidown"
        labels:
          severity: "critical"
          source: "grafana"
        isPaused: false
      - uid: "tm-api-5xx"
        title: "ApiHighErrorRatio"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              datasource:
                type: "prometheus"
                uid: "prometheus"
              editorMode: "code"
              expr: "job:http_request_errors:ratio_rate5m{job=\"api\"} and on (job) job:http_requests:rate5m{job=\"api\"} > 0.05"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.02
              refId: "C"
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        annotations:
          summary: "More than 2% of API responses are 5xx"
          runbook: "docs/OBSERVABILITY.md#apihigherrorratio"
        labels:
          severity: "critical"
          source: "grafana"
        isPaused: false
      - uid: "tm-api-p95"
        title: "ApiHighLatencyP95"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              datasource:
                type: "prometheus"
                uid: "prometheus"
              editorMode: "code"
              expr: "job:http_request_duration_seconds:p95_5m{job=\"api\"} and on (job) job:http_requests:rate5m{job=\"api\"} > 0.05"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 1
              refId: "C"
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        annotations:
          summary: "API p95 latency above 1s"
          runbook: "docs/OBSERVABILITY.md#apihighlatencyp95"
        labels:
          severity: "warning"
          source: "grafana"
        isPaused: false
      - uid: "tm-readiness"
        title: "ReadinessFailing"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              datasource:
                type: "prometheus"
                uid: "prometheus"
              editorMode: "code"
              expr: "min(probe_success{job=\"probes\",target=\"api-readiness\"})"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
              refId: "C"
        noDataState: "Alerting"
        execErrState: "Error"
        for: "2m"
        annotations:
          summary: "api /health/ready is failing"
          runbook: "docs/OBSERVABILITY.md#readinessfailing"
        labels:
          severity: "critical"
          source: "grafana"
        isPaused: false
      - uid: "tm-db-connections"
        title: "PostgresConnectionsSaturation"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              datasource:
                type: "prometheus"
                uid: "prometheus"
              editorMode: "code"
              expr: "sum(pg_stat_activity_count) / max(pg_settings_max_connections)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: "A"
          - refId: "B"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
              refId: "B"
          - refId: "C"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.8
              refId: "C"
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          runbook: "docs/OBSERVABILITY.md#postgresconnectionssaturation"
        labels:
          severity: "warning"
          source: "grafana"
        isPaused: false
