# Contact point: webhook from GRAFANA_ALERT_WEBHOOK_URL (compose passes a harmless default,
# so provisioning never fails; set a real Slack/Teams/ntfy/incident webhook for production).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: tm-webhook
    receivers:
      - uid: tm-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${GRAFANA_ALERT_WEBHOOK_URL}
          httpMethod: POST

policies:
  - orgId: 1
    receiver: tm-webhook
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: tm-webhook
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        repeat_interval: 1h
