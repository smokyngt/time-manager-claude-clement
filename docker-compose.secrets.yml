# Docker secrets instead of env values: `docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d`
# Create one file per secret under ${SECRETS_DIR:-./secrets} (chmod 0444 on the files, 0700 on the directory), no trailing newline needed.
# Remove the matching variables from .env. The api image loads <NAME>_FILE into <NAME> before the app starts.

x-api-secret-env: &api-secret-env
  DATABASE_URL: ""
  DATABASE_URL_FILE: /run/secrets/database_url
  JWT_ACCESS_SECRET: ""
  JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
  JWT_REFRESH_SECRET: ""
  JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
  ENCRYPTION_KEY: ""
  ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
  HASH_KEY: ""
  HASH_KEY_FILE: /run/secrets/hash_key
  SEED_ADMIN_PASSWORD: ""
  SEED_ADMIN_PASSWORD_FILE: /run/secrets/seed_admin_password

x-api-secrets: &api-secrets
  - database_url
  - jwt_access_secret
  - jwt_refresh_secret
  - encryption_key
  - hash_key
  - seed_admin_password

services:
  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]

  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]

  seed:
    environment: *api-secret-env
    secrets: *api-secrets

  api:
    environment: *api-secret-env
    secrets: *api-secrets

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  jwt_access_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_access_secret
  jwt_refresh_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_refresh_secret
  encryption_key:
    file: ${SECRETS_DIR:-./secrets}/encryption_key
  hash_key:
    file: ${SECRETS_DIR:-./secrets}/hash_key
  seed_admin_password:
    file: ${SECRETS_DIR:-./secrets}/seed_admin_password
